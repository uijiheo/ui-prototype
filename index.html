<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LTR화면(프로토타입)</title>
<style>
/* ===== 디자인 토큰: 기존 시스템 화면(사진) 기준 임시값. 실제 CSS 확인 후 여기만 교체 ===== */
:root {
  --navy: #1c2b52;
  --navy2: #0e1a38;
  --blue: #2f7fd6;
  --bg: #f1f4f9;
  --pn: #fff;
  --lab: #e9eef6;
  --key: #dfe9fb;
  --ln: #d2d9e5;
  --tx: #222;
  --mu: #666;
  --rd: #c0392b;
  --ok: #1d7a46;
  --wn: #8a5d00;
  --fs: 12px;
  --ctl: 24px;
  --rad: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181f;
    --pn: #1d222c;
    --lab: #2a303c;
    --key: #2c3b5e;
    --ln: #3b4252;
    --tx: #e6e8ee;
    --mu: #9aa3b5;
    --rd: #ff8a7a;
    --ok: #5fd08e;
    --wn: #e2b24c;
    --blue: #4a97ee;
  }
}
:root[data-theme="dark"] {
  --bg: #15181f;
  --pn: #1d222c;
  --lab: #2a303c;
  --key: #2c3b5e;
  --ln: #3b4252;
  --tx: #e6e8ee;
  --mu: #9aa3b5;
  --rd: #ff8a7a;
  --ok: #5fd08e;
  --wn: #e2b24c;
  --blue: #4a97ee;
}
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font: var(--fs)/1.45 "Malgun Gothic", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  background: var(--bg);
  color: var(--tx);
}
.top {
  background: linear-gradient(90deg, var(--navy2), var(--navy));
  color: #fff;
  border-radius: 0 0 0 28px;
  padding: 12px 18px;
  display: flex;
  gap: 28px;
  align-items: center;
  flex-wrap: wrap;
}
main {
  box-sizing: border-box;
  width: min(100%, 1560px);
  padding: 8px 12px 40px;
  max-width: 1560px;
  margin: 0 auto;
}
h1 {
  font-size: 14px;
  margin: 8px 0;
}
input, select, textarea {
  height: var(--ctl);
  border: 1px solid var(--ln);
  border-radius: var(--rad);
  padding: 0 8px;
  font: inherit;
  background: var(--pn);
  color: var(--tx);
  min-width: 0;
  width: 100%;
}
textarea {
  height: 48px;
  padding: 4px 8px;
  border-radius: 8px;
}
input[type=checkbox], input[type=radio] {
  width: auto;
  height: auto;
}
input:disabled:not([type=checkbox]), select:disabled, textarea:disabled {
  background: transparent;
  border-color: transparent;
  color: var(--tx);
  -webkit-text-fill-color: var(--tx);
  opacity: 1;
  appearance: none;
}
input[type=checkbox]:disabled {
  opacity: 1;
  accent-color: var(--navy);
}
:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 1px;
}
.b {
  height: var(--ctl);
  border: 1px solid var(--ln);
  border-radius: var(--rad);
  background: var(--pn);
  color: var(--tx);
  padding: 0 10px;
  font: inherit;
  cursor: pointer;
}
.b.p {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}
.b:disabled, button:disabled {
  opacity: .45;
  cursor: not-allowed;
}
.sbar {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  background: var(--lab);
  padding: 6px 10px;
  border-radius: var(--rad);
}
.sbar select {
  width: 130px;
}
.sbar #q {
  width: 300px;
  border-color: var(--blue);
}
.go {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--navy);
  color: #fff;
  border: 0;
  cursor: pointer;
}
section {
  margin: 12px 0;
}
.st {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
  margin: 4px 0;
  gap: 8px;
  flex-wrap: wrap;
}
.bt {
  display: flex;
  gap: 4px;
}
.g {
  display: grid;
  grid-template-columns: repeat(3, 92px 1fr);
  border-top: 1px solid var(--ln);
  border-left: 1px solid var(--ln);
  background: var(--pn);
  border-radius: 6px;
  overflow: hidden;
}
.l, .v, .gh {
  border-right: 1px solid var(--ln);
  border-bottom: 1px solid var(--ln);
  padding: 2px 6px;
  min-height: 26px;
  line-height: 1.25;
}
.l {
  background: var(--lab);
  font-weight: 700;
  text-align: right;
  display: flex;
  align-items: center;
  justify-content: flex-end;
}
.l.k {
  background: var(--key);
}
.v {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}
.v.w3 {
  grid-column: span 5;
}
.v.w2 {
  grid-column: span 3;
}
.v > input, .v > select {
  flex: 1 1 90px;
  width: auto;
}
.g.off {
  opacity: .55;
}
.mtab {
  display: flex;
  gap: 2px;
  border-bottom: 2px solid var(--navy);
  margin: 6px 0;
}
.mtab button {
  border: 1px solid var(--ln);
  border-bottom: 0;
  background: var(--lab);
  color: var(--tx);
  padding: 5px 14px;
  border-radius: 8px 8px 0 0;
  font: inherit;
  cursor: pointer;
}
.mtab button.on {
  background: var(--navy);
  color: #fff;
}
.mp[hidden] {
  display: none;
}
/* 상단 메뉴: 그룹 버튼에 커서를 올리거나 누르면 하위 화면 목록이 열린다 */
.top nav {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.mg {
  position: relative;
}
.mb {
  background: none;
  border: 1px solid #ffffff66;
  color: #fff;
  border-radius: 14px;
  height: 26px;
  padding: 0 14px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.mb.on, .mg.open .mb, .mg:hover .mb {
  background: #fff;
  color: var(--navy);
}
.msub {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  min-width: 170px;
  padding: 4px;
  background: var(--pn);
  border: 1px solid var(--ln);
  border-radius: 8px;
  z-index: 7;
  flex-direction: column;
  gap: 2px;
  box-shadow: 0 4px 10px #0003;
}
.mg:hover .msub, .mg.open .msub, .mg:focus-within .msub {
  display: flex;
}
.mg.shut .msub {
  display: none!important;
}
.mi {
  background: none;
  border: 0;
  border-radius: 6px;
  text-align: left;
  padding: 5px 10px;
  font: inherit;
  color: var(--tx);
  cursor: pointer;
}
.mi:hover, .mi.on {
  background: var(--key);
}
.tbar {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin: 8px 0;
}
.tbar .b {
  border-radius: 6px;
}
.mdl.xl {
  max-width: 980px;
}
.doc h3 {
  margin: 0 0 8px;
  text-align: center;
}
.doc p {
  margin: 6px 0;
  line-height: 1.7;
}
.sig {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin-top: 10px;
  border-top: 1px solid var(--ln);
  border-left: 1px solid var(--ln);
}
.sig div {
  border-right: 1px solid var(--ln);
  border-bottom: 1px solid var(--ln);
  text-align: center;
  padding: 2px;
}
.sig div:nth-child(n+4) {
  height: 36px;
}
@media print {
  body > *:not(#ov) {
    display: none!important;
  }
  #ov {
    position: static;
    background: none;
  }
  .mdl {
    max-width: none;
    max-height: none;
    overflow: visible;
  }
  .noprint, #mx {
    display: none!important;
  }
  :root {
    padding: 0;
  }
}
.hist {
  font-size: 11px;
  margin: 0 0 0 8px;
  padding-left: 8px;
  border-left: 2px solid var(--ln);
}
.hist div {
  padding: 1px 0;
}
.hist .tg {
  font-weight: 600;
}
.cols {
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.mainc {
  flex: 1;
  min-width: 0;
}
#fn {
  width: 128px;
  flex: none;
  position: sticky;
  top: 8px;
  max-height: calc(100vh - 16px);
  overflow: auto;
  border: 1px solid var(--navy);
  border-radius: var(--rad);
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  background: var(--pn);
}
#fn .b {
  width: 100%;
  height: 26px;
  border-radius: 6px;
  font-size: 11.5px;
  padding: 0 4px;
}
.mdl.wide {
  max-width: 680px;
  width: calc(100% - 24px);
  max-height: 90vh;
  overflow: auto;
}
@media (max-width: 1000px) {
  .cols {
    flex-direction: column;
  }
  #fn {
    width: auto;
    position: static;
    flex-direction: row;
    flex-wrap: wrap;
    max-height: none;
  }
  #fn .b {
    width: auto;
    padding: 0 10px;
  }
}
.gh {
  grid-column: 1/-1;
  background: var(--lab);
  color: var(--blue);
  font-weight: 700;
}
.t {
  border-collapse: collapse;
  width: 100%;
  background: var(--pn);
}
.t th, .t td {
  border: 1px solid var(--ln);
  padding: 3px 6px;
  white-space: nowrap;
  text-align: left;
}
.t th {
  background: var(--lab);
}
.t td.r {
  text-align: right;
}
.t tr[data-a] {
  cursor: pointer;
}
.t tr.sel td {
  background: var(--key);
}
.t tr.gh td {
  background: var(--lab);
  color: var(--blue);
  font-weight: 700;
}
.t tr.miss td {
  background: color-mix(in srgb, var(--rd) 14%, transparent);
}
.sc {
  overflow-x: auto;
}
.ex td:first-child, .ex th:first-child {
  position: sticky;
  left: 0;
  background: var(--pn);
}
.sum {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  background: var(--pn);
  border: 1px solid var(--ln);
  border-radius: var(--rad);
  padding: 6px 12px;
}
.mu, .hint {
  color: var(--mu);
}
.hint {
  margin: 4px 0;
}
.err {
  color: var(--rd);
}
small.err {
  display: block;
  width: 100%;
}
.empty {
  padding: 18px;
  text-align: center;
  color: var(--mu);
  background: var(--pn);
  border: 1px dashed var(--ln);
  border-radius: var(--rad);
}
.pill {
  padding: 1px 10px;
  border-radius: 10px;
  background: var(--lab);
}
.s-ok {
  color: var(--ok);
}
.s-fail {
  color: var(--rd);
}
#toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--navy);
  color: #fff;
  padding: 8px 16px;
  border-radius: var(--rad);
  display: none;
  z-index: 8;
}
#toast.e {
  background: var(--rd);
  color: #fff;
}
#ov {
  position: fixed;
  inset: 0;
  background: #0007;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9;
}
#ov[hidden] {
  display: none;
}
.mdl {
  background: var(--pn);
  padding: 18px;
  border-radius: var(--rad);
  max-width: 360px;
}
@media (max-width: 800px) {
  .g {
    grid-template-columns: 100px 1fr;
  }
  .v.w3, .v.w2 {
    grid-column: span 1;
  }
}
</style>
</head>
<body>
<header class="top">
  <nav id="nav"></nav>
</header>
<main>
  <h1 id="ttl">이용자 종합 상담</h1>

  <!-- 고객 검색: 검색조건 선택 → 검색값 입력 → 돋보기/Enter -->
  <form id="sf" class="sbar" autocomplete="off">
    <select id="cond" aria-label="검색조건">
      <option value="name">이용자명</option>
      <option value="biz">사업자등록번호</option>
      <option value="birth">생년월일</option>
      <option value="rep">대표자명</option>
      <option value="plate">차량번호</option>
      <option value="ct">계약번호</option>
    </select>
    <input id="q" aria-label="검색��">
    <button class="go" aria-label="검색">&#128269;</button>
    <button type="button" class="b" id="newc">고객등록</button>
    <span class="mu" id="exh">테스트 예시: <b>홍길동</b>, <b>00주식회사</b>를 검색하면 정보를 확인할 수 있습니다.</span>
  </form>

  <!-- 본문(#res 검색결과, #app 화면) + 우측 업무 기능 버튼(#fn) -->
  <div class="cols">
    <div class="mainc">
      <div id="res"></div>
      <div id="app"></div>
    </div>
    <aside id="fn" aria-label="업무 기능"></aside>
  </div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="ov" hidden></div>
<script>
'use strict';
