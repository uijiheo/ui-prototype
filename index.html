<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이용자 종합 상담 (프로토타입)</title>
<style>
/* ===== 디자인 토큰: 기존 시스템 화면(사진) 기준 임시값. 실제 CSS 확인 후 여기만 교체 ===== */
:root{--navy:#1c2b52;--navy2:#0e1a38;--blue:#2f7fd6;--bg:#f4f4f2;--pn:#fff;--lab:#e8e8e4;--key:#f7f0c6;--ln:#cdcdc7;--tx:#222;--mu:#666;--rd:#c0392b;--ok:#1d7a46;--wn:#8a5d00;--fs:12px;--ctl:24px;--rad:12px}

:root[data-theme="dark"]{--bg:#15181f;--pn:#1d222c;--lab:#2a303c;--key:#4a4320;--ln:#3b4252;--tx:#e6e8ee;--mu:#9aa3b5;--rd:#ff8a7a;--ok:#5fd08e;--wn:#e2b24c;--blue:#4a97ee}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;font:var(--fs)/1.45 "Malgun Gothic","Noto Sans KR","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--tx)}
.top{background:linear-gradient(90deg,var(--navy2),var(--navy));color:#fff;border-radius:0 0 0 28px;padding:12px 18px;display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.top nav{display:flex;gap:24px;flex-wrap:wrap;font-weight:700;font-size:13px}
main{padding:8px 12px 40px;max-width:1560px;margin:0 auto}
.demo{border:1px solid var(--wn);color:var(--wn);padding:4px 10px;border-radius:var(--rad);margin:6px 0;font-size:11px}
h1{font-size:14px;margin:8px 0}
input,select,textarea{height:var(--ctl);border:1px solid var(--ln);border-radius:var(--rad);padding:0 8px;font:inherit;background:var(--pn);color:var(--tx);min-width:0;width:100%}
textarea{height:48px;padding:4px 8px;border-radius:8px}
input[type=checkbox],input[type=radio]{width:auto;height:auto}
input:disabled:not([type=checkbox]),select:disabled,textarea:disabled{background:transparent;border-color:transparent;color:var(--tx);-webkit-text-fill-color:var(--tx);opacity:1;appearance:none}input[type=checkbox]:disabled{opacity:1;accent-color:var(--navy)}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.b{height:var(--ctl);border:1px solid var(--ln);border-radius:var(--rad);background:var(--pn);color:var(--tx);padding:0 10px;font:inherit;cursor:pointer}
.b.p{background:var(--blue);border-color:var(--blue);color:#fff}
.b:disabled,button:disabled{opacity:.45;cursor:not-allowed}
.sbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--lab);padding:6px 10px;border-radius:var(--rad)}
.sbar select{width:130px}.sbar #q{width:300px;border-color:var(--blue)}
.go{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;border:0;cursor:pointer}
section{margin:12px 0}
.st{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin:4px 0;gap:8px;flex-wrap:wrap}
.bt{display:flex;gap:4px}
.g{display:grid;grid-template-columns:repeat(3,92px 1fr);border-top:1px solid var(--ln);border-left:1px solid var(--ln);background:var(--pn)}
.l,.v,.gh{border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:2px 6px;min-height:26px;line-height:1.25}
.l{background:var(--lab);font-weight:700;text-align:right;display:flex;align-items:center;justify-content:flex-end}
.l.k{background:var(--key)}
.v{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.v.w3{grid-column:span 5}.v.w2{grid-column:span 3}.v>input,.v>select{flex:1 1 90px;width:auto}.v small.mono{flex:1 0 100%}.g.off{opacity:.55}
/* 상단 메뉴: 그룹 버튼에 커서를 올리거나 누르면 하위 화면 목록이 열린다 */
.top nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mg{position:relative}
.mb{background:none;border:1px solid #ffffff66;color:#fff;border-radius:14px;height:26px;padding:0 14px;font:inherit;font-weight:700;cursor:pointer}
.mb.on,.mg.open .mb,.mg:hover .mb{background:#fff;color:var(--navy)}
.msub{display:none;position:absolute;top:100%;left:0;min-width:170px;padding:4px;background:var(--pn);border:1px solid var(--ln);border-radius:8px;z-index:7;flex-direction:column;gap:2px;box-shadow:0 4px 10px #0003}
.mg:hover .msub,.mg.open .msub,.mg:focus-within .msub{display:flex}.mg.shut .msub{display:none!important}
.mi{background:none;border:0;border-radius:6px;text-align:left;padding:5px 10px;font:inherit;color:var(--tx);cursor:pointer}.mi:hover,.mi.on{background:var(--key)}
.tbar{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.tbar .b{border-radius:6px}
.mdl.xl{max-width:980px}.doc h3{margin:0 0 8px;text-align:center}.doc p{margin:6px 0;line-height:1.7}
.sig{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;border-top:1px solid var(--ln);border-left:1px solid var(--ln)}.sig div{border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);text-align:center;padding:2px}.sig div:nth-child(n+4){height:36px}
@media print{body>*:not(#ov){display:none!important}#ov{position:static;background:none}.mdl{max-width:none;max-height:none;overflow:visible}.noprint,#mx{display:none!important}:root{padding:0}}.hist{font-size:11px;margin:0 0 0 8px;padding-left:8px;border-left:2px solid var(--ln)}.hist div{padding:1px 0}.hist .tg{font-weight:600}
.cols{display:flex;gap:8px;align-items:flex-start}.mainc{flex:1;min-width:0}
#fn{width:128px;flex:none;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;border:1px solid var(--navy);border-radius:var(--rad);padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--pn)}
#fn .b{width:100%;height:26px;border-radius:6px;font-size:11.5px;padding:0 4px}
.mdl.wide{max-width:680px;width:calc(100% - 24px);max-height:90vh;overflow:auto}
@media(max-width:1000px){.cols{flex-direction:column}#fn{width:auto;position:static;flex-direction:row;flex-wrap:wrap;max-height:none}#fn .b{width:auto;padding:0 10px}}
.gh{grid-column:1/-1;background:var(--lab);color:var(--blue);font-weight:700}
.t{border-collapse:collapse;width:100%;background:var(--pn)}
.t th,.t td{border:1px solid var(--ln);padding:3px 6px;white-space:nowrap;text-align:left}
.t th{background:var(--lab)}
.t td.r{text-align:right}
.t tr[data-a]{cursor:pointer}.t tr.sel td{background:var(--key)}
.t tr.gh td{background:var(--lab);color:var(--blue);font-weight:700}
.t tr.miss td{background:color-mix(in srgb,var(--rd) 14%,transparent)}
.sc{overflow-x:auto}
.ex td:first-child,.ex th:first-child{position:sticky;left:0;background:var(--pn)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--navy);margin-bottom:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--ln);border-bottom:0;background:var(--lab);color:var(--tx);padding:5px 14px;border-radius:8px 8px 0 0;font:inherit;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff}
.sum{display:flex;gap:16px;flex-wrap:wrap;background:var(--pn);border:1px solid var(--ln);border-radius:var(--rad);padding:6px 12px}
.mu,.hint{color:var(--mu)}.hint{margin:4px 0}
.err{color:var(--rd)}small.err{display:block;width:100%}
.empty{padding:18px;text-align:center;color:var(--mu);background:var(--pn);border:1px dashed var(--ln);border-radius:var(--rad)}
.pill{padding:1px 10px;border-radius:10px;background:var(--lab)}.s-ok{color:var(--ok)}.s-fail{color:var(--rd)}
.mono{font-family:ui-monospace,Consolas,monospace}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:8px 16px;border-radius:var(--rad);display:none;z-index:8}
#toast.e{background:var(--rd);color:#fff}
#ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9}#ov[hidden]{display:none}
.mdl{background:var(--pn);padding:18px;border-radius:var(--rad);max-width:360px}
@media(max-width:800px){.g{grid-template-columns:100px 1fr}.v.w3,.v.w2{grid-column:span 1}}
</style></head><body>
<header class="top"><nav id="nav"></nav></header>
<main>
<h1 id="ttl">이용자 종합 상담</h1>
<form id="sf" class="sbar" autocomplete="off">
<select id="cond" aria-label="검색조건"><option value="name">이용자명</option><option value="biz">사업자등록번호</option><option value="birth">생년월일</option><option value="rep">대표자명</option><option value="plate">차량번호</option><option value="ct">계약번호</option></select>
<input id="q" aria-label="검색값"><button class="go" aria-label="검색">&#128269;</button>
<button type="button" class="b" id="newc">고객등록</button><span class="mu" id="exh">테스트 예시: <b>홍길동</b>, <b>00주식회사</b>를 검색하면 정보를 확인할 수 있습니다.</span></form>
<div class="cols"><div class="mainc"><div id="res"></div><div id="app"></div></div><aside id="fn" aria-label="업무 기능"></aside></div>
</main><div id="toast" role="status" aria-live="polite"></div><div id="ov" hidden></div>
<script>
'use strict';
/* =====================================================================
 1. 설정·공통코드·정책  (TODO: 운영 공통코드/정책 API로 교체. 여기 값은 모두 데모)
 ===================================================================== */
const P=a=>a.map(x=>Array.isArray(x)?x:[x,x]);
const CODES={
 custType:[['P','개인'],['S','개인사업자'],['C','법인']],
 carrier:['SKT','KT','LG U+','알뜰폰'],              // 데모값: 실제 통신사 목록 미확정
 base:['고흥','연천'],                                // 사용본거지: 검토 중인 후보값(확정 아님)
 resVendor:['오토핸즈','유카','오토플러스'],           // 미지정 허용
 mtProduct:['셀프','스탠다드'],
 penalty:[['direct','직접납부'],['notice','통지서'],['change','임차인변경']], // TODO: 실제 명칭(법칙금유형) 확인
 bill:[['post','우편'],['email','이메일'],['none','발송 거부']],
 bizState:[['susp','휴업'],['closed','폐업'],['normal','사업']], // 기존 시스템 표기 그대로. TODO: '사업'이 정상영업을 의미하는지 확인
 kmBasis:[['y','연간'],['t','전체 계약기간']],          // TODO: 약정거리 기준 정책 확인
 insurer:['샘플화재','테스트손해보험'],            // 보험사명. 외부 보험사코드와 별개 관리
 daemul:[[1e8,'1억'],[2e8,'2억'],[3e8,'3억'],[5e8,'5억']], // 원 단위 저장. 확정 상품 아님
 deduct:[[300000,'30만원'],[500000,'50만원']],
 age:[['0020','21세'],['0030','26세']],               // NOTE: M/T 코드는 선행 0 보존 위해 문자열
 alt:[['0001','없음'],['0002','1만원'],['0003','2만원'],['0004','3만원']],
 rel:['배우자','직원','기타'],
 termState:['해지진행중','매각후해지종결','해지종결'], // TODO: 진행상태 값 목록 확인(매각후해지종결 외는 임시)
 termReason:['정상해지','강제해지(미납)','강제해지(기타)'], // TODO: 해지사유 값 목록 확인
 termRet:['반납','미반납'],
 cs:{dept:['CS','ACT','Collection'],type:['inbound','outbound'],method:['일반','out'],kind:['전화상담'],
  content:['기타','결제'],detail:{'기타':['기타'],'결제':['연체','기타']},resp:['본인','대리인','기타'],result:['미상담','기타'],
  tags:['자동이체일자 변경','LMS 발송','고객정보 변경','기타']} // TODO: inbound/outbound와 out/일반 중복 여부 — 기존 운영코드 확인 필요
};
const CS_CASCADE=true; // 상담 내용→상세내용 연동 여부(설정)
/* [추가운전자 정책] — 화면에는 표기하지 않고 값과 동작 방식만 코드에 보관한다(이전에 표기하던 '운전자 정책' 문구 삭제).
   POLICY.driver (null = '정책 미설정'. 0회/무제한으로 해석하지 않는다)
     max          : 최대 지정 인원. 숫자로 확정되면 drvOp()의 '추가'에서 초과 시 차단한다(현재 적용 코드는 있음)
     limit        : 변경 가능 횟수.            → 아직 검사 로직 없음. 확정 후 drvOp()/COMMIT.ins()에서 변경이력(hist) 건수로 검사하도록 추가
     period       : 변경 횟수 산정 기간.      → 아직 미사용. 확정 후 hist의 변경일시 필터 기준으로 사용
     countFirst   : 최초 등록을 변경 횟수에 포함할지(true/false) → 아직 미사용
     countRelease : 지정 해제를 변경 횟수에 포함할지(true/false) → 아직 미사용
   allowRelease : '지정 해제' 버튼 허용 여부(현재 true).
   화면에 다시 표기하려면 tabIns()의 '추가운전자 정보' 제목 옆에 "최대 지정 인원 ${pv(pd.max)} · 변경 가능 횟수 ${pv(pd.limit)} …" 형태로 출력하면 된다(pv/pd는 tabIns 안에 이미 정의됨). */
const POLICY={driver:{max:null,limit:null,period:null,countFirst:null,countRelease:null}, // null = 정책 미설정(0/무제한으로 해석 금지)
 allowRelease:true,showTxType:true /* 거래선구분: 필요 여부 업무 확인 필요(TODO). 숨기려면 false */,showSoleContact:false};
const PERM={custEdit:true,acctView:false,ctEdit:true,drvChange:true,csAdd:true,mtSend:true}; // NOTE: 화면 제어용일 뿐 운영 권한은 서버에서 검증
const MT_BIZ={P:'0001',S:'0002',C:'0004'};   // 비즈니스유형코드(문자열)
const MT_ADDR_SRC='a1';                      // 오픈링크 고객주소 ← 주소1(a1)/주소2(a2) 매핑 설정
const MT_REQ=[]; // TODO: M/T 필수 항목 미확정. 확정되면 항목명을 추가 (예: ['고객번호'])

/* =====================================================================
 2. 변환·포맷 함수 (표시값과 저장/연동값 분리)
 ===================================================================== */
const $=s=>document.querySelector(s),clone=o=>JSON.parse(JSON.stringify(o)),delay=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dig=s=>String(s||'').replace(/\D/g,''),ymd=d=>String(d||'').replace(/-/g,''),num=n=>n===''||n==null?'':Number(n).toLocaleString('ko-KR');
const fmtTel=s=>{const d=dig(s);return d.length===11?`${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`:(s||'')};
const fmtBiz=s=>{const d=dig(s);return d.length===10?`${d.slice(0,3)}-${d.slice(3,5)}-${d.slice(5)}`:(s||'')};
const maskTel=s=>fmtTel(s).replace(/-\d{4}-/,'-****-'),maskBiz=s=>fmtBiz(s).replace(/\d{5}$/,'*****');
const maskAcct=n=>{n=String(n||'');return PERM.acctView?n:n.slice(0,3)+'*'.repeat(Math.max(0,n.length-6))+n.slice(-3)};
/* 원→만원/천원: 나누어떨어지지 않으면 조용히 반올림하지 않고 오류 반환 */
const won2=(w,u)=>{if(w===''||w==null)return{v:''};const n=Number(w);if(!Number.isFinite(n))return{e:'숫자 형식 오류'};if(n%u)return{e:`${num(u)}원 단위로 나누어떨어지지 않음(반올림 안 함)`};return{v:String(n/u)}};
const now=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`},today=()=>now().slice(0,10);
const tname=t=>CODES.custType.find(x=>x[0]===t)?.[1]||'';
const W=v=>v===''||v==null?'':num(v)+'원',K=v=>v===''||v==null?'':num(v)+' km';

/* =====================================================================
 3. Mock 데이터 / Mock API  (TODO: api 객체의 각 메서드를 내부 백엔드 REST 호출로 교체)
    모든 인물·번호는 가상값. 실제 고객정보 사용 금지.
 ===================================================================== */
const A=(z,r,rd,j,jd)=>({zip:z,road:r,roadDtl:rd,jibun:j,jibunDtl:jd});
const mkCust=(id,o)=>Object.assign({id,code:'',type:'P',name:'',txType:'이용자',birth6:'',bizNo:'',rep:'',nation:'대한민국',guarantor:'',tel:'',hp:'',email:'',a1:A('','','','',''),a2:A('','','','',''),contact:{name:'',tel:'',hp:''},vAcct:{bank:'',no:''},wAcct:{bank:'',no:''},bill:'',penalty:'',notif:{sms:false,smsMonthly:false,precall:false,smsRemain:false,lms:false},carrier:'',bizState:'',bizDate:''},o);
const mt0=()=>({customerNo:'',corpNo:'',industry:'',bizCond:'',vehClass:'',region:'',mtCar:'',contractKm:'',kmExempt:'N',asName:'',asTel:'',asHp:'',as:A('','','','',''),insCode:'',cv:{dain:'Y',daemul:'Y',self:'N',car:'N',unins:'N',emerg:'N',rent:'N',newcar:'N'},deathWon:'',carPriceWon:'',alt:'0001',nextInsp:'',nextPrec:''});

const set=(o,p,v)=>{const ks=p.split('.'),l=ks.pop();ks.reduce((a,k)=>a[k],o)[l]=v};

const isDirty=()=>Object.values(S.dirty).some(Boolean);
const resetEdit=()=>{S.edit={};S.d={};S.dirty={};S.err={};S.drv=-1};
function toast(t,k){const e=$('#toast');e.textContent=t;e.className=k||'';e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
function ask(msg){return new Promise(r=>{const o=$('#ov');o.innerHTML=`<div class="mdl" role="alertdialog" aria-modal="true"><p>${esc(msg)}</p><button class="b p" id="y">계속 진행</button> <button class="b" id="n">돌아가기</button></div>`;o.hidden=false;const f=v=>{o.hidden=true;o.innerHTML='';r(v)};$('#y').onclick=()=>f(true);$('#n').onclick=()=>f(false);$('#n').focus()})}

/* =====================================================================
 5. 공통 UI 컴포넌트 (입력/그리드/테이블/섹션)
 ===================================================================== */
function inp(sc,p,o={}){const ed=S.edit[sc]&&!o.ro,v=val(sc,p),er=S.err[sc+'.'+p],t=o.t||'text';
 const a=`data-s="${sc}" data-p="${p}" data-t="${t}"${o.r?' data-r="1"':''}${ed?'':' disabled'}`;let h;
 if(t==='sel')h=`<select ${a}>${o.blank===false&&v!==''&&v!=null?'':'<option value="">미지정</option>'}${P(o.o).map(([k,l])=>`<option value="${esc(k)}"${String(v)===String(k)?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
 else if(t==='chk')h=`<label><input type="checkbox" ${a}${v?' checked':''}> ${esc(o.lb||'')}</label>`;
 else if(t==='rad')h=P(o.o).map(([k,l])=>`<label><input type="radio" name="${sc}${p}" value="${esc(k)}" ${a}${v===k?' checked':''}> ${esc(l)}</label>`).join(' ');
 else if(t==='cg')h=P(o.o).map(([k,l])=>`<label><input type="checkbox" data-s="${sc}" data-p="${p}" data-t="cg" data-k="${esc(k)}"${ed?'':' disabled'}${v===k?' checked':''}> ${esc(l)}</label>`).join(' '); // 체크박스 택1: 하나 선택 시 나머지 해제
 else if(t==='ta')h=`<textarea ${a}>${esc(v)}</textarea>`;
 else h=`<input ${t==='date'?'type="date"':''} ${a} value="${esc(!ed&&o.f?o.f(v):v)}" placeholder="${esc(o.ph||'')}"${o.n?' inputmode="numeric"':''}>`;
 return h+(er?`<small class="err">${esc(er)}</small>`:'')}
const F=(lb,h,o={})=>`<div class="l${o.k?' k':''}">${lb}</div><div class="v${o.w?' w3':o.h?' w2':''}">${h}</div>`;
const sec=(t,b,bt='')=>`<section><div class="st"><span>• ${t}</span><span class="bt">${bt}</span></div>${b}</section>`;
const tbl=(h,rows,c='')=>`<div class="sc"><table class="t ${c}"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${h.length}" class="mu">데이터 없음</td></tr>`}</tbody></table></div>`;
/* 저장 버튼은 영역별 분리: 라벨로 저장 범위를 명시 */
const acts=(sc,lb,ok)=>S.edit[sc]?`<button class="b p" data-a="save:${sc}"${S.busy?' disabled':''}>${S.busy?'저장 중…':lb+' 저장'}</button><button class="b" data-a="cancel:${sc}"${S.busy?' disabled':''}>취소</button>`:`<button class="b" data-a="edit:${sc}"${ok&&(sc==='cust'?S.cust:CT())?'':' disabled'}>수정</button>`;

 M/T 전용 입력 항목(법인등록번호·업종·업태·검사주기예외·AS담당자/소재지·담보 예/아니오·담보사망한도·차량가격·대체교통비·검사일)만 수정한다.
 화면에는 운영자가 읽는 표시값만 노출하고, 전송 규격은 각 줄 주석에 기록한다(실제 변환은 내부 백엔드 어댑터가 VPN 경유로 수행).
 add(그룹, 항목명, 표시값, 전송값, 표시값이 입력창(HTML)인지) — 전송값은 mock 검증용으로만 계산하며 화면에는 노출하지 않는다.
 화면 항목명에서는 '코드'를 뺀다(코드는 개발자 전송용). 대응 전송 필드명: 비즈니스유형코드·MT차명코드·차량등급코드·차적지코드·보험사코드·보험연령코드·대체교통비용코드

const MTX={yn:[['Y','예'],['N','아니오']]};
const MT_CAR={'그랑콜레오스':['MTC001','0007','중형 SUV'],'필랑트':['MTC002','0007','중형 SUV'],'아르카나':['MTC003','0006','준중형 SUV'],'QM6':['MTC004','0007','중형 SUV']}; // 차량명→[MT차명코드, 차량등급코드(숫자4자 문자열), 등급명]. TODO: 오픈링크 코드표 수신 후 교체(현재 샘플)
const MT_REG={'고흥':'0003','연천':'0004'}; // 사용본거지→차적지코드(숫자4자 문자열). TODO: 매핑 확인
const INS_CODE={}; // 보험사명→보험사코드(비즈니스파트너번호). TODO: 공식 코드 수신 후 입력(임의 생성 금지)
function mtRows(){const c=cu(),k=ck(),i=k.ins,has=!!CT(),mc=MT_CAR[k.car]||[],R=[],V=p=>val('mt',p),E=(p,o)=>inp('mt',p,o),YN=p=>E(p,{t:'sel',o:MTX.yn,blank:false});
 const add=(g,lb,disp,send,h)=>{const o=send&&typeof send==='object'?send:{v:send},s=o.v??'';R.push({g,lb,disp:h?disp:esc(disp),send:s,err:o.e,miss:MT_REQ.includes(lb)&&!o.e&&s===''})};
 add('0','M/T 업체',k.mtVendor,'');   // 오픈링크 고정
 add('0','M/T 상품',k.mtProduct,'');  // 셀프/스탠다드 등: 계약정보의 M/T 상품

 add('A','고객번호',c.code,c.code);                                        // 전송: 문자열. 이용자코드를 연동(별도 고객번호 체계가 있으면 매핑 교체)
 add('A','비즈니스유형',tname(c.type),MT_BIZ[c.type]);                 // 전송: "0001"(개인) "0002"(개인사업자) "0004"(법인사업자), 문자열
 add('A','법인명',c.type==='C'?c.name:'',c.type==='C'?c.name:'');

 add('A','고객명',c.name,c.name);
 const a=c[MT_ADDR_SRC];[['우편번호','zip'],['기본주소(도로명)','road'],['상세주소(도로명)','roadDtl'],['기본주소(지번)','jibun'],['상세주소(지번)','jibunDtl']].forEach(([l,p])=>add('A','고객'+l,a[p],a[p])); // 주소1/2 중 전송 대상은 MT_ADDR_SRC
 add('A','고객유선전화번호',fmtTel(c.tel),dig(c.tel));                      // 전송: 숫자만(하이픈 여부 명세 확인 필요)
 add('A','고객무선전화번호',fmtTel(c.hp),dig(c.hp));
 add('A','사업자등록번호',c.type==='P'?'':fmtBiz(c.bizNo),c.type==='P'?'':dig(c.bizNo)); // 전송: 숫자 10자리
 add('A','대표자명',c.rep,c.rep);
 add('A','업종명',E('industry'),V('industry'),1);
 add('A','업태명',E('bizCond'),V('bizCond'),1);
 add('B','차대번호',k.vin,k.vin);                                           // 차량정보 연동(수정은 계약정보)
 add('B','차량번호',k.plate,k.plate);
 add('B','MT차명',has?k.car+' '+k.model:'',mc[0]||'');                  // 화면: 차명 / 전송: MT업체 제공 코드(MT_CAR)
 add('B','차량등급',mc[2]||'',mc[1]||'');                               // 화면: 등급명 / 전송: 숫자 4자 문자열("0007"). 숫자 7로 바꾸면 안 됨(선행 0)
 add('B','차량등록일자',k.regDate,ymd(k.regDate));                          // 전송: YYYYMMDD
 add('B','차적지',k.base,MT_REG[k.base]||'');                           // 화면: 사용본거지 / 전송: 숫자 4자 문자열
 add('B','위탁사계약번호',k.id,k.id);                                       // 계약정보 연동
 add('B','MT계약시작일자',k.start,ymd(k.start));                            // 전송: YYYYMMDD (예 20261023)
 add('B','MT계약종료일자',k.end,ymd(k.end));
 add('B','계약주행거리(km)',K(k.agreedKm),String(k.agreedKm));              // 약정거리 연동. 전송: ',' 없는 숫자. 연간/전체 기준 미확정 → 변환 없이 그대로
 add('B','최초주행거리(km)',K(k.firstKm),String(k.firstKm));                // 전송: ',' 없는 숫자
 add('B','검사주기예외여부',E('kmExempt',{t:'sel',o:MTX.yn,blank:false}),V('kmExempt'),1); // 화면 예/아니오 → 전송 "Y"/"N"
 [['AS담당자명','asName'],['AS담당자유선전화번호','asTel'],['AS담당자무선전화번호','asHp'],['AS소재지우편번호','as.zip'],['AS소재지기본주소(도로명)','as.road'],['AS소재지상세주소(도로명)','as.roadDtl'],['AS소재지기본주소(지번)','as.jibun'],['AS소재지상세주소(지번)','as.jibunDtl']].forEach(([l,p])=>add('C',l,E(p),V(p),1)); // 법인 담당자와 별개 개념, 계약 후 입력
 add('D','보험시작일자',i.start,ymd(i.start));                              // 전송: YYYYMMDD
 add('D','보험종료일자',i.end,ymd(i.end));
 add('D','보험사',i.company,INS_CODE[i.company]||'');                    // 화면: 보험사명 / 전송: 보험사코드(비즈니스파트너번호)
 add('D','보험연령',(CODES.age.find(x=>x[0]===i.age)||[])[1]||'',i.age); // 전송: "0020"(21세) "0030"(26세) 문자열
 [['대인담보여부','cv.dain'],['대물담보여부','cv.daemul'],['자손담보여부','cv.self'],['자차보험가입여부','cv.car'],['무보험차량상해가입여부','cv.unins'],['긴급출동가입여부','cv.emerg'],['렌터카담보특약가입여부','cv.rent']].forEach(([l,p])=>add('D',l,YN(p),V(p),1)); // 화면 예/아니오 → 전송 "Y"/"N"
 add('D','임직원특약가입여부',has?(i.emp?'예':'아니오'):'',has?(i.emp?'Y':'N'):''); // 보험조건의 임직원특약에서 연동
 add('D','신차보상특약가입여부',YN('cv.newcar'),V('cv.newcar'),1);
 add('D','대인무한담보금액',has?'무한':'','');                               // 전송: 만원 단위. '무한'에 대응하는 전송값 미제공 → 0 등 임의 매핑 금지(확인 필요)
 add('D','대물담보한도금액',has?((CODES.daemul.find(x=>+x[0]===+i.daemul)||[])[1]||num(i.daemul))+'원':'',won2(i.daemul,1e4)); // 화면: 원 단위 / 전송: 만원(나누어떨어지지 않으면 오류, 반올림 안 함)
 add('D','담보사망한도금액',E('deathWon',{n:1,f:W}),won2(V('deathWon'),1e4),1); // 화면: 원 / 전송: 만원
 add('D','차량가격',E('carPriceWon',{n:1,f:W}),won2(V('carPriceWon'),1e3),1);   // 화면: 원 / 전송: 천원
 add('D','대체교통비용',E('alt',{t:'sel',o:CODES.alt,blank:false}),V('alt'),1); // 전송: "0001"없음 "0002"1만원 "0003"2만원 "0004"3만원
 add('D','면책금',W(i.deduct),String(i.deduct));                            // 전송: 원 단위
 add('E','차기정기검사일자',E('nextInsp',{t:'date'}),ymd(V('nextInsp')),1);   // 전송: YYYYMMDD. 계산 규칙 미제공 → 자동 계산 안 함
 add('E','차기정밀검사일자',E('nextPrec',{t:'date'}),ymd(V('nextPrec')),1);
 return R}
function tabMt(k){const st=k.mtSt,R=mtRows(),ed=S.edit.mt,has=!!CT(),SN={none:'미연동',ready:'전송 준비',proc:'처리 중',ok:'성공',fail:'실패'},GN={'0':'가입 M/T',A:'고객·사업자',B:'차량·계약',C:'AS 담당자·소재지',D:'보험·담보',E:'검사 일정'};
 let g='',cells='';
 R.forEach(r=>{if(r.g!==g){g=r.g;cells+=`<div class="gh">${GN[g]}${g==='C'&&ed?' <button class="b" data-a="cp:ct">법인 담당자 복사</button> <button class="b" data-a="cp:ad">주소1 복사</button>':''}</div>`}
  cells+=F(r.lb,r.disp+(r.err?`<small class="err">${esc(r.err)}</small>`:''))});
 return`<div class="st"><span>• M/T 가입정보 <small class="mu">(저장 범위: M/T 전용 입력 항목 · 계약·차량·보험에서 가져온 값은 읽기 전용)</small></span><span class="bt">${acts('mt','M/T 전용정보',PERM.mtSend)}</span></div>`
 +`<div class="g">${cells}</div>`
 +`<details style="margin-top:6px"><summary class="mu">연동 상태·전송 (개발용 mock · 실제 VPN 미연결)</summary><div class="g" style="margin-top:4px">`
 +F('연동 상태',`<b class="pill s-${st.status}">${SN[st.status]}</b> <small class="mu">내부 관리 상태(공식 응답코드 아님)</small>`,{h:1})+F('연동 모드','mock')
 +F('실제 VPN 연결','<b class="err">미연결</b> <small class="mu">내부 백엔드 경유 예정</small>',{h:1})+F('응답코드',esc(st.code)||'없음')
 +F('최근 시도일시',st.last||'없음')+F('최근 성공일시',st.lastOk||'없음')+F('응답메시지',esc(st.msg)||'없음')
 +F('검증 결과',esc(st.verify),{w:1})
 +F('실행',`<button class="b" data-a="ver"${ed||!has?' disabled':''}>검증</button><button class="b p" data-a="send"${ed||!has||!PERM.mtSend||st.status==='proc'?' disabled':''}>mock 전송</button><button class="b" disabled title="연동 명세·운영 권한 확인 전까지 비활성">실제 전송(비활성)</button>${ed?'<small class="mu">저장 후 전송 가능</small>':''}`,{w:1})+`</div></details>`}
async function mtSend(){const st=CT().mtSt;st.status='proc';st.last=now();render();await delay(600);
 const bad=mtRows().filter(r=>r.miss||r.err);
 if(bad.length)Object.assign(st,{status:'fail',verify:`누락/오류 ${bad.length}건: `+bad.map(r=>r.lb).join(', '),code:'MOCK-E01',msg:'mock 검증 실패(오픈링크 공식 응답 아님)'});
 else Object.assign(st,{status:'ok',lastOk:st.last,verify:'통과',code:'MOCK-OK',msg:'mock 성공 응답(실제 전송 아님)'});render()}

function csPanel(){const L=DB.cs[cu().id]||[],f=S.csF,N=5,CC=CODES.cs,I=(p,o)=>inp('cs',p,o),e=S.edit.cs;
 const R=L.filter(r=>(!f.from||r.date>=f.from)&&(!f.to||r.date<=f.to)&&(!f.dept||r.dept===f.dept)&&(!f.by||r.counselor===f.by)&&(!f.tag||r.tags.includes(f.tag))).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
 const pages=Math.max(1,Math.ceil(R.length/N));S.pg=Math.min(S.pg,pages-1);const sel=L.find(r=>r.id===S.csSel);

 `<div class="sbar">기간 <input type="date" data-f="from" value="${f.from||''}" style="width:130px"> ~ <input type="date" data-f="to" value="${f.to||''}" style="width:130px"> 부서 ${fs('dept',CC.dept)} 상담자 ${fs('by',[...new Set(L.map(r=>r.counselor))])} 태그 ${fs('tag',CC.tags)}</div>`

 +`<div class="g${e?'':' off'}" id="csform" style="margin-top:6px">${F('상담일자',I('date',{t:'date'}),{k:1})}${F('상담시간',I('time',{ph:'HH:MM'}))}${F('전화번호',I('phone'))}${F('구분',I('kind',{t:'sel',o:CC.kind,blank:false}))}${F('상담부서',I('dept',{t:'sel',o:CC.dept}))}${F('유형',I('type',{t:'sel',o:CC.type}))}${F('상담방법',I('method',{t:'sel',o:CC.method}))}${F('내용',I('content',{t:'sel',o:CC.content,r:1}))}${F('상세내용',I('detail',{t:'sel',o:CS_CASCADE?det:[...new Set(Object.values(CC.detail).flat())]}))}${F('응답자 구분',I('resp',{t:'sel',o:CC.resp}))}${F('결과',I('result',{t:'sel',o:CC.result}))}${F('등록일자','<span class="mu">저장 시 자동</span>')}${F('상담자명',I('counselor'))}${F('연결 계약번호',I('ct',{t:'sel',o:(DB.ct[cu().id]||[]).map(k=>[k.id,k.id+' / '+k.plate])}))}${F('특이사항',I('special',{t:'chk',lb:'특이사항 있음'}))}${F('업무 태그',CC.tags.map(t=>I('tg.'+t,{t:'chk',lb:t})).join(''),{w:1})}${F('메모내용',I('memo',{t:'ta'}),{w:1})}</div>`

/* =====================================================================

    TERM 설정값은 확정 전 임시값. 스케줄·연체·청구금액 산식은 '데모 산식'이며 운영에서는 스케줄/정산 API로 교체한다.
 ===================================================================== */
const TERM={lateRate:0.15,   // 연체이율(연). 데모값 — TODO: 확정 이율로 교체
 feeRate:null};              // 중도해지 위약금율. null = 정책 미설정(계산에서 제외하고 '정책 미설정'으로 표시, 0으로 해석 금지)
const RENT_ST={'정상':'이용중','연체관리':'이용중(연체)','종료':'종료'};
const dd=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5),addDays=(a,n)=>new Date(Date.parse(a)+n*864e5).toISOString().slice(0,10);
const acqOf=k=>((k.exec||[]).find(r=>r.st==='승계')||(k.exec||[])[0]||{}).acq||0; // 취득원가: 실행내역(승계) 기준
const lastPay=sc=>[...sc].reverse().find(r=>r.st==='수납')?.due||'';           // 마지막 수납일자(마지막 자동이체 수납)
/* 납입 스케줄(데모 산식): 수납예정일=시작일+n개월, 원금=(취득원가-잔존가)/기간 균등, 이자=월 납입금-원금, 잔여원금=취득원가-누적원금.
   수납상태: 오늘 이전 도래분=수납, k.late 만큼 최근 회차는 미수납(연체). TODO: 운영에서는 스케줄 API 값 사용 */
function sched(k){const n=Number(k.months)||0,A=acqOf(k),tot=A-Number(k.residual||0),pr=n?Math.floor(tot/n/10)*10:0,T=today(),R=[];if(!n||!k.start)return R;
 const[y,m,d]=k.start.split('-').map(Number);let cum=0;
 for(let i=1;i<=n;i++){const mm=m-1+i,yy=y+Math.floor(mm/12),mo=mm%12+1,dy=Math.min(d,new Date(yy,mo,0).getDate()),due=`${yy}-${String(mo).padStart(2,'0')}-${String(dy).padStart(2,'0')}`;
  const p=i===n?tot-cum:pr;cum+=p;R.push({n:i,due,amt:Number(k.monthly),pr:p,it:Math.max(0,Number(k.monthly)-p),bal:A-cum,st:due>T?'미도래':'수납'})}
 const dn=R.filter(r=>r.st==='수납').length;for(let i=Math.max(0,dn-(Number(k.late)||0));i<dn;i++)R[i].st='미수납';return R}
/* 청구금액 시뮬레이션(데모 산식): 기준일까지 도래한 미납 렌트료 + 연체이자(미납금×연체이율×연체일수/365) + 잔여 원금(기준일 이후 미도래 원금+잔존가) [+ 위약금: 정책 확정 시] - 보증금 */
function simulate(k,date){const sc=sched(k),due=sc.filter(r=>r.due<=date);let un=0,li=0,bal=acqOf(k),cnt=0;

 if(D.f&&ch){S.csF[D.f]=el.value;S.pg=0;render();return}
 if(!D.s)return;const t=D.t;if(!ch&&(t==='sel'||t==='chk'||t==='rad'||t==='cg'))return;
 set(S.d[D.s],D.p,t==='chk'?el.checked:t==='cg'?(el.checked?D.k:''):el.value);S.dirty[D.s]=true;delete S.err[D.s+'.'+D.p];
 if(D.s==='cust'&&D.p==='type'&&el.value!=='C')S.d.cust.guarantor='';

 if(D.s==='cust'&&D.p==='bizState')S.d.cust.bizDate=el.checked?today():''; // 휴폐업 상태 변경 시 확인일자=변경일(달력으로 수정 가능)
 if(D.s==='cs'&&D.p==='content')S.d.cs.detail='';if(D.r||t==='cg')render()}
